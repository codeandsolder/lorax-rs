name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      command: |
        cargo test --locked --workspace --all-features --all-targets
        cargo test --locked --workspace --all-features --doc
      strict-suites: |
        [
          {"name":"all-features","cargo":["--locked","--workspace","--all-targets","--all-features"],"allow-test-panics":true}
        ]
