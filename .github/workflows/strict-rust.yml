name: Strict Rust

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7cd4c792bd6aba2807b4accc42dfb3e9db238634 # main
    with:
      cargo-args: "--locked --workspace --all-targets --all-features"
      ban-python-outside-ci: true
      allow-test-panics: true # tests use ordinary assertion and Result unwrap ergonomics
  tests:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@2e8ed8421d595fbb99f6adef510a84411dbe4078 # main
    with:
      command: |
        cargo test --locked --workspace --all-features --all-targets
        cargo test --locked --workspace --all-features --doc
      test-impact-cargo-args: --locked --workspace --all-features
